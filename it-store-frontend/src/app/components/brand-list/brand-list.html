<div class="container py-4">
  <h1 class="mb-4 text-primary fw-bold">Gestion des marques</h1>

  <!-- Formulaire -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      @if (editingBrand) {
        <h5 class="card-title mb-3">Modifier la marque</h5>
        <form (ngSubmit)="updateBrand()">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nom</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="editingBrand.name"
                name="editName"
                required
              />
            </div>
            <div class="col-md-6 d-flex align-items-end gap-2">
              <button type="submit" class="btn btn-primary">Enregistrer</button>
              <button type="button" class="btn btn-outline-secondary" (click)="cancelEdit()">
                Annuler
              </button>
            </div>
          </div>
        </form>
      } @else {
        <h5 class="card-title mb-3">Ajouter une marque</h5>
        <form (ngSubmit)="createBrand()">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nom</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="newBrandName"
                name="name"
                required
              />
            </div>
            <div class="col-md-6 d-flex align-items-end">
              <button type="submit" class="btn btn-success">+ Créer</button>
            </div>
          </div>
        </form>
      }
    </div>
  </div>

  <!-- Tableau -->
  <div class="card shadow-sm">
    <div class="card-body">
      <h5 class="card-title mb-3">Liste des marques</h5>

      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Nom</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (brand of brands; track brand.id) {
            <tr>
              <td>{{ brand.id }}</td>
              <td class="fw-semibold">{{ brand.name }}</td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary me-2" (click)="startEdit(brand)">
                  Modifier
                </button>
                <button class="btn btn-sm btn-outline-danger" (click)="deleteBrand(brand.id)">
                  Supprimer
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>

      @if (brands.length === 0) {
        <p class="text-muted text-center py-3 mb-0">Aucune marque pour le moment.</p>
      }
    </div>
  </div>
</div>
