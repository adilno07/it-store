<div class="admin-shell">
  <!-- Sidebar fixe -->
  <div class="sidebar bg-dark text-white p-3">
    <h4 class="mb-4">IT Store Admin</h4>

    <nav class="nav flex-column gap-1">
      <a class="nav-link text-white" routerLink="/admin/products" routerLinkActive="active-link">

      <a class="nav-link text-white" routerLink="/admin/brands" routerLinkActive="active-link">
        Marques
      </a>
      <a class="nav-link text-white" routerLink="/admin/stock" routerLinkActive="active-link">

      </a>
      <a class="nav-link text-white" routerLink="/admin/customers" routerLinkActive="active-link">
        Clients
      </a>
      <a class="nav-link text-white" routerLink="/admin/sales" routerLinkActive="active-link">
