<div class="auth-page">
  <div class="auth-card">
    <h3 class="auth-title mb-4">Se connecter</h3>

    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" [(ngModel)]="email" name="email" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Mot de passe</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      @if (errorMessage) {
        <div class="alert alert-danger py-2">{{ errorMessage }}</div>
      }

      <button type="submit" class="btn btn-primary w-100 mt-2">Se connecter</button>
    </form>

    <p class="auth-switch mt-4 mb-0 text-center">
      Pas encore de compte ?
      <a routerLink="/account/register">Créer un compte</a>
    </p>
  </div>
</div>
