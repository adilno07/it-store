<div class="auth-page">
  <div class="auth-card">
    <h3 class="auth-title mb-4">Créer un compte</h3>

    <form (ngSubmit)="onSubmit()">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Prénom</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="firstName"
            name="firstName"
            required
          />
        </div>
        <div class="col-md-6">
          <label class="form-label">Nom</label>
          <input type="text" class="form-control" [(ngModel)]="lastName" name="lastName" required />
        </div>
        <div class="col-12">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="email" name="email" required />
        </div>
        <div class="col-12">
          <label class="form-label">Téléphone</label>
          <input
            type="tel"
            class="form-control"
            [(ngModel)]="phone"
            name="phone"
            placeholder="0612345678"
          />
        </div>
        <div class="col-12">
          <label class="form-label">Mot de passe</label>
          <input
            type="password"
            class="form-control"
            [(ngModel)]="password"
            name="password"
            required
          />
        </div>
      </div>

      @if (errorMessage) {
        <div class="alert alert-danger py-2 mt-3">{{ errorMessage }}</div>
      }

      <button type="submit" class="btn btn-primary w-100 mt-4">Créer mon compte</button>
    </form>

    <p class="auth-switch mt-4 mb-0 text-center">
      Déjà un compte ?
      <a routerLink="/account/login">Se connecter</a>
    </p>
  </div>
</div>
